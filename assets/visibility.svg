<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .crosshair-path { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; }
    .center-text { font-family: 'Georgia', 'Times New Roman', serif; font-style: italic; font-weight: bold; fill: #ffffff; font-size: 26px; text-anchor: middle; }
  </style>

  <g transform="translate(50, 50)">
    <!-- Outer Target Ring Segments -->
    <path d="M -22,-14 A 26,26 0 0,1 22,-14" class="crosshair-path" />
    <path d="M 25,-6 A 26,26 0 0,1 25,6" class="crosshair-path" />
    <path d="M 22,14 A 26,26 0 0,1 -22,14" class="crosshair-path" />
    <path d="M -25,6 A 26,26 0 0,1 -25,-6" class="crosshair-path" />
    
    <!-- Crosshair Ticks -->
    <line x1="0" y1="-26" x2="0" y2="-33" class="crosshair-path" />
    <line x1="26" y1="0" x2="33" y2="0" class="crosshair-path" />
    <line x1="-26" y1="0" x2="-33" y2="0" class="crosshair-path" />
    
    <!-- Stylized "3a" Core Text -->
    <text x="-1" y="9" class="center-text">3a</text>
  </g>
</svg>
